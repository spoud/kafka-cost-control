kafka:
  application:
    id: kafka-cost-control
  bootstrap:
    servers: localhost:9092
  schema:
    registry:
      url: http://localhost:8081

cc:
  olap:
    enabled: false
    database:
      # technically this is already the default, but let's be explicit
      url: "jdbc:duckdb:/tmp/cc/local.db"
  ai:
    # Natural-language querying of the OLAP data. Requires cc.olap.enabled=true as well,
    # since every question is ultimately answered from the DuckDB table.
    enabled: false
    # Model writes the SQL but never sees the results; only the schema shape leaves the network.
    # Answers become tables rather than prose.
    private-mode: false

    # The entire configuration surface for choosing a model. Defaults to a local Ollama.
    base-url: ${CC_AI_BASE_URL:http://localhost:11434/v1}
    model: ${CC_AI_MODEL:qwen3-coder:latest}
    # Placeholder, not empty: an empty string converts to null and fails startup validation.
    api-key: ${CC_AI_API_KEY:not-configured}
    # Few-second defaults are too short: a local model loads into memory, then does tool calls.
    request-timeout: ${CC_AI_REQUEST_TIMEOUT:PT10M}
  admin-password: admin
  metrics:
    aggregations:
      confluent_kafka_server_retained_bytes: max
  topics:
    pricing-rules: pricing-rules
    context-data: context-data
    aggregated: aggregated
    aggregated-table-friendly: aggregated-table-friendly
    raw-data:
      - metrics-raw-telegraf-env

mp:
  messaging:
    connector:
      smallrye-kafka:
        schema:
          registry:
            url: ${kafka.schema.registry.url}

    outgoing:
      pricing-rules-out:
        connector: smallrye-kafka
        topic: ${cc.topics.pricing-rules}
        apicurio:
          registry:
            auto:
              register: true
      context-data-out:
        connector: smallrye-kafka
        topic: ${cc.topics.context-data}
        apicurio:
          registry:
            auto:
              register: true

avro:
  codegen:
    avsc:
      imports: entity-type-enum.avsc

quarkus:
  kafka-streams:
    application-id: ${kafka.application.id}
    topics: ${cc.topics.raw-data},${cc.topics.context-data},${cc.topics.pricing-rules},${cc.topics.aggregated}
    state:
      dir: /tmp/cc/my-streams
    default:
      key:
        serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      value:
        serde: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
  security:
    users:
      embedded:
        enabled: true
        plain-text: true
        users:
          admin: ${cc.admin-password}
        roles:
          admin: ADMIN
  http:
    auth:
      basic: true
  smallrye-graphql:
    schema-include-scalars: true
    error-extension-fields: exception,code,classification
    ui:
      enable: true
      root-path: /graphql-ui
      always-include: true
  log:
    category:
      "io.confluent":
        level: WARN
      "org.apache.kafka":
        level: WARN
      "io.spoud.kcc":
        level: INFO
      "org.jooq.Constants":
        level: WARN
  container-image:
    build: true
  # One client for every vendor: they all speak the OpenAI chat-completions protocol, so changing
  # provider is a base URL rather than a dependency. Set cc.ai.base-url to one of:
  #
  #   http://localhost:11434/v1                          Ollama, local, no key
  #   https://api.openai.com/v1                          OpenAI
  #   https://api.anthropic.com/v1/                      Anthropic; no prompt caching there
  #   https://generativelanguage.googleapis.com/v1beta/openai/   Gemini
  #   https://openrouter.ai/api/v1                       OpenRouter
  #
  # The model must support tool calling; the assistant cannot answer without it.
  langchain4j:
    openai:
      base-url: ${cc.ai.base-url}
      api-key: ${cc.ai.api-key}
      timeout: ${cc.ai.request-timeout}
      chat-model:
        model-name: ${cc.ai.model}
      # Off: prompts carry metric and context names, results can carry topic names.
      log-requests: false
      log-responses: false

"%dev":
  mp:
    messaging:
      connector:
        smallrye-kafka:
          apicurio:
            registry:
              url: ${kafka.schema.registry.url}/apis/registry/v2
  cc:
    aggregation-window-size: PT1H
    olap:
      enabled: true
    ai:
      # Works out of the box against a local Ollama; no key needed.
      enabled: true
