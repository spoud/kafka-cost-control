kafka:
  application:
    id: kafka-cost-control
  bootstrap:
    servers: localhost:9092
  schema:
    registry:
      url: http://localhost:8081

cc:
  olap:
    enabled: false
    database:
      # technically this is already the default, but let's be explicit
      url: "jdbc:duckdb:/tmp/cc/local.db"
  ai:
    # Natural-language querying of the OLAP data. Requires cc.olap.enabled=true as well,
    # since every question is ultimately answered from the DuckDB table.
    #
    # Model and provider are NOT configured here - see quarkus.langchain4j.* below.
    enabled: false
    # Private mode: the model writes the SQL but never sees the results. Rows go straight to
    # the user. Only the schema shape (metric names, context keys) and the question leave the
    # network; no values and no query output. The cost is that answers are tables, not prose.
    private-mode: false

    # --- Which model to talk to. Provider-agnostic: these five settings are all you configure,
    # whichever vendor you point at. They are mapped onto each provider's own property names
    # under quarkus.langchain4j.* below.
    #
    #   anthropic  hosted Claude. Needs CC_AI_API_KEY.
    #   ollama     a model on your own machine or cluster. Needs no key; set CC_AI_BASE_URL if
    #              it is not on localhost. The model must support tool calling.
    #
    # CC_AI_BASE_URL is the fifth knob and is deliberately env-var-only, not a property here:
    # the sensible default differs per provider, and a property with an empty default is a real
    # value that would stop each provider's own fallback from firing.
    #
    # Adding a vendor is a dependency in pom.xml plus a block below - see the note there.
    provider: ${CC_AI_PROVIDER:anthropic}
    model: ${CC_AI_MODEL:claude-opus-4-5}
    # Placeholder rather than empty: providers validate this at startup even when not selected,
    # and an empty string converts to null and fails. Ignored by providers that need no key.
    api-key: ${CC_AI_API_KEY:not-configured}
    # A local model has to load into memory and then write SQL across several tool round-trips,
    # so the usual 10s default is far too short.
    request-timeout: ${CC_AI_REQUEST_TIMEOUT:PT10M}
  admin-password: admin
  metrics:
    aggregations:
      confluent_kafka_server_retained_bytes: max
  topics:
    pricing-rules: pricing-rules
    context-data: context-data
    aggregated: aggregated
    aggregated-table-friendly: aggregated-table-friendly
    raw-data:
      - metrics-raw-telegraf-env

mp:
  messaging:
    connector:
      smallrye-kafka:
        schema:
          registry:
            url: ${kafka.schema.registry.url}

    outgoing:
      pricing-rules-out:
        connector: smallrye-kafka
        topic: ${cc.topics.pricing-rules}
        apicurio:
          registry:
            auto:
              register: true
      context-data-out:
        connector: smallrye-kafka
        topic: ${cc.topics.context-data}
        apicurio:
          registry:
            auto:
              register: true

avro:
  codegen:
    avsc:
      imports: entity-type-enum.avsc

quarkus:
  kafka-streams:
    application-id: ${kafka.application.id}
    topics: ${cc.topics.raw-data},${cc.topics.context-data},${cc.topics.pricing-rules},${cc.topics.aggregated}
    state:
      dir: /tmp/cc/my-streams
    default:
      key:
        serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      value:
        serde: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
  security:
    users:
      embedded:
        enabled: true
        plain-text: true
        users:
          admin: ${cc.admin-password}
        roles:
          admin: ADMIN
  http:
    auth:
      basic: true
  smallrye-graphql:
    schema-include-scalars: true
    error-extension-fields: exception,code,classification
    ui:
      enable: true
      root-path: /graphql-ui
      always-include: true
  log:
    category:
      "io.confluent":
        level: WARN
      "org.apache.kafka":
        level: WARN
      "io.spoud.kcc":
        level: INFO
      "org.jooq.Constants":
        level: WARN
  container-image:
    build: true
  # Which LLM the assistant talks to.
  #
  # Two providers are on the classpath (see pom.xml), so one must be chosen explicitly:
  #   anthropic - hosted Claude. Best quality; the question, metric names, context keys and
  #               (unless cc.ai.private-mode=true) query results leave your network.
  #   ollama    - a model on your own machine or cluster. Nothing leaves the network at all.
  #
  # To add another vendor, put its quarkus-langchain4j-* artifact on the classpath and name it
  # here: -openai, -mistral-ai, -gemini, -vertex-ai, -watsonx. OpenRouter is reached through the
  # OpenAI provider with quarkus.langchain4j.openai.base-url=https://openrouter.ai/api/v1
  # Which LLM the assistant talks to.
  #
  # Configure it through the provider-agnostic cc.ai.* block above (CC_AI_PROVIDER, CC_AI_MODEL,
  # CC_AI_API_KEY, CC_AI_BASE_URL, CC_AI_REQUEST_TIMEOUT). The per-provider blocks below exist
  # only to feed those same values into whatever each LangChain4j provider happens to call them:
  # `chat-model.model-name` here, `chat-model.model-id` there, `api-key` on some and not others.
  # That naming is LangChain4j's, not ours, so the mapping cannot be avoided - but it is confined
  # to this file and nobody configuring the app has to know about it.
  #
  # To add a provider: put its quarkus-langchain4j-* artifact on the classpath and add a block
  # here that wires the same cc.ai.* values into its property names. Nothing else changes; the
  # application code only ever sees LangChain4j's ChatModel interface.
  #
  # Every provider is validated at startup even when inactive, so each block needs values that
  # parse - hence the fallbacks. Only the selected provider's values are actually used.
  langchain4j:
    chat-model:
      provider: ${cc.ai.provider}

    anthropic:
      api-key: ${cc.ai.api-key}
      chat-model:
        model-name: ${cc.ai.model}
        max-tokens: 8000
      timeout: ${cc.ai.request-timeout}
      # Off by default: prompts carry your metric names and context keys, and results can carry
      # topic and application names.
      log-requests: false
      log-responses: false

    ollama:
      # Provider-specific fallback: only used when CC_AI_BASE_URL is not set.
      base-url: ${CC_AI_BASE_URL:http://localhost:11434}
      # Belongs to the Ollama client, NOT to chat-model: nesting it one level deeper is silently
      # ignored and you get the 10s default back.
      timeout: ${cc.ai.request-timeout}
      chat-model:
        # Must be a model with tool-calling support - the assistant is built entirely on tools.
        # `ollama show <model>` lists capabilities; look for "tools".
        model-id: ${cc.ai.model}
      log-requests: false
      log-responses: false

"%dev":
  mp:
    messaging:
      connector:
        smallrye-kafka:
          apicurio:
            registry:
              url: ${kafka.schema.registry.url}/apis/registry/v2
  cc:
    aggregation-window-size: PT1H
    olap:
      enabled: true
    ai:
      # Still needs ANTHROPIC_API_KEY in the environment to actually answer anything.
      enabled: true
