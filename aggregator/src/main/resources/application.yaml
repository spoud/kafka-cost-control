kafka:
  application:
    id: kafka-cost-control
  bootstrap:
    servers: localhost:9092
  schema:
    registry:
      url: http://localhost:8081

cc:
  # A window keeps accepting points this long after it ends. It closes as soon as any newer record
  # arrives, so without grace a point only minutes late is dropped from the hour's total.
  aggregation-window-grace: PT5M
  olap:
    enabled: false
    database:
      # technically this is already the default, but let's be explicit
      url: "jdbc:duckdb:"
  ai:
    # Natural-language querying of the OLAP data. Requires cc.olap.enabled=true as well,
    # since every question is ultimately answered from the DuckDB table.
    enabled: false
    # Model writes the SQL but never sees the results; only the schema shape leaves the network.
    # Answers become tables rather than prose.
    private-mode: false

    # The entire configuration surface for choosing a model. Defaults to a local Ollama.
    base-url: ${CC_AI_BASE_URL:http://localhost:11434/v1}
    model: ${CC_AI_MODEL:qwen3.8:27b}
    # Placeholder, not empty: an empty string converts to null and fails startup validation.
    api-key: ${CC_AI_API_KEY:not-configured}
    # Few-second defaults are too short: a local model loads into memory, then does tool calls.
    request-timeout: ${CC_AI_REQUEST_TIMEOUT:PT10M}
    # Tokens one question may spend across all its round trips; 0 removes the ceiling. The other
    # limits bound how many calls and how long each query runs, not what a question costs.
    max-tokens-per-question: ${CC_AI_MAX_TOKENS_PER_QUESTION:200000}
  admin-password: admin
  auth:
    # none | basic | oidc - see AuthConfigProperties
    mode: basic
  metrics:
    # Gauges that report a current level are sampled many times per window; summing them
    # multiplies the value by the number of samples (60 per hour at a 1-minute scrape).
    aggregations:
      confluent_kafka_server_retained_bytes: max
      confluent_kafka_server_partition_count: max
      kafka_topic_partition_count: max
      kafka_topic_schema_count: max
  topics:
    pricing-rules: pricing-rules
    context-data: context-data
    aggregated: aggregated
    aggregated-table-friendly: aggregated-table-friendly
    raw-data:
      - metrics-raw-telegraf-env

mp:
  messaging:
    connector:
      smallrye-kafka:
        schema:
          registry:
            url: ${kafka.schema.registry.url}
        # Required by Quarkus for the Avro-typed channels below, but not used at runtime: the
        # serializer in play is Confluent's, driven by schema.registry.url above. A reserved
        # .invalid host makes it obvious nothing is meant to resolve this.
        apicurio:
          registry:
            url: http://apicurio.invalid/

    outgoing:
      pricing-rules-out:
        connector: smallrye-kafka
        topic: ${cc.topics.pricing-rules}
        apicurio:
          registry:
            auto:
              register: true
      context-data-out:
        connector: smallrye-kafka
        topic: ${cc.topics.context-data}
        apicurio:
          registry:
            auto:
              register: true

avro:
  codegen:
    avsc:
      imports: entity-type-enum.avsc

quarkus:
  kafka-streams:
    application-id: ${kafka.application.id}
    topics: ${cc.topics.raw-data},${cc.topics.context-data},${cc.topics.pricing-rules},${cc.topics.aggregated}
    state:
      dir: /tmp/my-streams
    default:
      key:
        serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      value:
        serde: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
  security:
    users:
      embedded:
        enabled: true
        plain-text: true
        users:
          admin: ${cc.admin-password}
        roles:
          admin: ADMIN
  http:
    # behind an ingress: the OIDC redirect URI must use the external scheme and host
    proxy:
      proxy-address-forwarding: true
      allow-x-forwarded: true
      enable-forwarded-host: true
    auth:
      # the admin user (cc.admin-password): the sign-in in basic mode, and for scripts in oidc mode
      basic: true
      # All or nothing, set by cc.auth.mode: KccAccessPolicy guards every path except these.
      permission:
        open:
          paths: /q/health,/q/health/*,/q/metrics,/q/dev-ui,/q/dev-ui/*,/auth/me,/auth/logout
          policy: permit
        app:
          paths: /*
          policy: kcc
  # Used when cc.auth.mode=oidc, which also switches it on (AuthModeSwitch). The provider comes
  # from the installation: QUARKUS_OIDC_PROVIDER=google or QUARKUS_OIDC_AUTH_SERVER_URL, plus
  # QUARKUS_OIDC_CLIENT_ID and QUARKUS_OIDC_CREDENTIALS_SECRET.
  oidc:
    application-type: web-app
    authentication:
      scopes: email,profile
      # register https://<host>/auth/callback at the provider
      redirect-path: /auth/callback
      restore-path-after-redirect: true
      # the UI's requests get 499 instead of a redirect they can't follow, and send the browser to /auth/login
      java-script-auto-redirect: false
    token-state-manager:
      # only the ID token's claims are needed; keeps the session cookie small
      strategy: id-token
  keycloak:
    devservices:
      enabled: false
  smallrye-graphql:
    schema-include-scalars: true
    error-extension-fields: exception,code,classification
    # bad input (e.g. a price without a unit) should say what's wrong, not "System error"
    show-runtime-exception-message: jakarta.ws.rs.BadRequestException
    ui:
      enable: true
      root-path: /graphql-ui
      always-include: true
  log:
    category:
      "io.confluent":
        level: WARN
      "org.apache.kafka":
        level: WARN
      "io.spoud.kcc":
        level: INFO
      "org.jooq.Constants":
        level: WARN
  container-image:
    build: true
  # One client for every vendor: they all speak the OpenAI chat-completions protocol, so changing
  # provider is a base URL rather than a dependency. Set cc.ai.base-url to one of:
  #
  #   http://localhost:11434/v1                          Ollama, local, no key
  #   https://api.openai.com/v1                          OpenAI
  #   https://api.anthropic.com/v1/                      Anthropic; no prompt caching there
  #   https://generativelanguage.googleapis.com/v1beta/openai/   Gemini
  #   https://openrouter.ai/api/v1                       OpenRouter
  #
  # The model must support tool calling; the assistant cannot answer without it.
  langchain4j:
    openai:
      base-url: ${cc.ai.base-url}
      api-key: ${cc.ai.api-key}
      timeout: ${cc.ai.request-timeout}
      chat-model:
        model-name: ${cc.ai.model}
      # Off: prompts carry metric and context names, results can carry topic names.
      log-requests: false
      log-responses: false

# Dev only. Defaults above are left at their production values; everything local lives here, so
# `quarkus.profile=dev` is the only thing that moves them.
"%dev":
  cc:
    aggregation-window-size: PT1H
    olap:
      # on in dev so the OLAP-backed queries (metricContextKeys, the cost-overview Group By) have
      # data without a /api/v1/kafka-stream/reprocess first
      enabled: true
      database:
        # file-backed so it survives a restart, under /tmp/cc with the state dir below so
        # `rm -rf /tmp/cc` is a clean slate
        url: "jdbc:duckdb:/tmp/cc/local.db"
    ai:
      # Works out of the box against a local Ollama; no key needed.
      enabled: true
  quarkus:
    kafka-streams:
      state:
        dir: /tmp/cc/my-streams
