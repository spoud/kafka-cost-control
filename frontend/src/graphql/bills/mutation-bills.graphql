mutation saveBill($request: BillSaveRequestInput!) {
    saveBill(request: $request) {
        month
        cluster
        coveredUntil
        lines {
            description
            amount
            allocation
            metrics
            context {
                key
                value
            }
        }
        updatedAt
        updatedBy
    }
}

mutation deleteBill($month: String!, $cluster: String) {
    deleteBill(month: $month, cluster: $cluster) {
        month
        cluster
    }
}
