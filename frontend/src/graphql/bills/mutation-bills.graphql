mutation saveBill($request: BillSaveRequestInput!) {
    saveBill(request: $request) {
        month
        coveredUntil
        networkWrite
        networkRead
        storage
        partitions
        otherLines {
            description
            amount
            allocation
            context {
                key
                value
            }
        }
        updatedAt
        updatedBy
    }
}

mutation deleteBill($month: String!) {
    deleteBill(month: $month) {
        month
    }
}
