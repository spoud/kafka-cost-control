query bills {
    bills {
        month
        cluster
        coveredUntil
        lines {
            description
            amount
            allocation
            metrics
            context {
                key
                value
            }
        }
        updatedAt
        updatedBy
    }
}

query billedCosts($request: BilledCostRequestInput!) {
    billedCosts(request: $request) {
        metrics {
            metric
            shares {
                name
                contextValues
                price
                estimatedPrice
            }
        }
        months {
            month
            billed
            from
            to
            billedUntil
            clusters
        }
    }
}

query billRates($month: String!, $cluster: String) {
    billRates(month: $month, cluster: $cluster) {
        metricName
        line
        amount
        usage
        costFactor
    }
}

query clusters {
    clusters
}
