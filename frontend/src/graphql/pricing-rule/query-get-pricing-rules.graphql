query getPricingRules{
    pricingRules{
        creationTime
        metricName
        baseCost
        costFactor
        price
        priceUnit
        multiplier
        multiplierLabel
        validFrom
        earlierPrices {
            validFrom
            validUntil
            baseCost
            costFactor
            price
            priceUnit
            multiplier
            multiplierLabel
        }
    }
}
