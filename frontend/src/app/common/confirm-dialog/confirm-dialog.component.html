<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
    @if (data.contentTemplate) {
        <ng-container
            [ngTemplateOutlet]="data.contentTemplate"
            [ngTemplateOutletContext]="data.templateContext"
        ></ng-container>
    } @else if (data.message) {
        <p>{{ data.message }}</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-stroked-button mat-dialog-close>{{ data.cancelLabel ?? 'Cancel' }}</button>
    <button
        mat-flat-button
        [color]="data.destructive ? 'warn' : 'primary'"
        [mat-dialog-close]="true"
        cdkFocusInitial
    >
        {{ data.confirmLabel ?? 'Confirm' }}
    </button>
</mat-dialog-actions>
