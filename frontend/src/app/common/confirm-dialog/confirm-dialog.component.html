<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
    @if (data.contentTemplate) {
        <ng-container
            [ngTemplateOutlet]="data.contentTemplate"
            [ngTemplateOutletContext]="data.templateContext"
        ></ng-container>
    } @else if (data.message) {
        <p>{{ data.message }}</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <!-- Focus cancel, not confirm: this dialog exists to make someone stop and read, and with
         focus on confirm a stray Enter fires the action outright. Cancel is the safe default
         whatever the action is, so it stays initial focus regardless of `destructive`. -->
    <button mat-stroked-button mat-dialog-close cdkFocusInitial>
        {{ data.cancelLabel ?? 'Cancel' }}
    </button>
    <button
        mat-flat-button
        [color]="data.destructive ? 'warn' : 'primary'"
        [mat-dialog-close]="true"
    >
        {{ data.confirmLabel ?? 'Confirm' }}
    </button>
</mat-dialog-actions>
