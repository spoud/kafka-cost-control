<header class="page-header">
    <div class="page-header-text">
        <h1>{{ title() }}</h1>
        @if (subtitle()) {
            <p class="subtitle">{{ subtitle() }}</p>
        }
    </div>
    <div class="page-header-actions">
        <ng-content select="[actions]"></ng-content>
    </div>
</header>
