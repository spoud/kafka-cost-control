<app-page-header title="Explore" subtitle="Get insight into your Kafka usage."></app-page-header>

<app-filter-bar>
    <app-graph-filter [existingFilter]="restoredFilter" (graphFilter)="filter.set($event)" />
</app-filter-bar>

@if (filter()?.groupByContext && filter()?.metricName) {
    <a mat-stroked-button color="primary" class="csv-link" [href]="csvDownloadUrl()">
        <mat-icon>description</mat-icon>
        Generate CSV report for all metrics for selected context and date range
    </a>
    <mat-button-toggle-group
        class="measure-toggle"
        aria-label="What the charts show"
        [value]="showCost() ? 'cost' : 'usage'"
        (change)="showCost.set($event.value === 'cost')"
    >
        <mat-button-toggle value="usage"><mat-icon>show_chart</mat-icon>Usage</mat-button-toggle>
        <mat-button-toggle value="cost"><mat-icon>sell</mat-icon>Cost</mat-button-toggle>
    </mat-button-toggle-group>
    @if (noData()) {
        <app-empty-state
            icon="search_off"
            message="No data for this metric in the selected range."
        ></app-empty-state>
    } @else if (noCostData()) {
        <app-empty-state
            icon="sell"
            message="No cost for this metric in the selected range: no bill covers it and no pricing rule prices it."
        >
            <a actions mat-stroked-button routerLink="/pricing-rules">Open Pricing Rules</a>
        </app-empty-state>
    } @else {
        <app-graph-panel
            [metricsData]="historyData.value() || []"
            [range]="selectedRange()"
            [showCost]="showCost()"
        />
    }
} @else {
    <app-empty-state
        icon="bar_chart"
        message="Please select a context and a metric to view the dashboard."
    ></app-empty-state>
}
