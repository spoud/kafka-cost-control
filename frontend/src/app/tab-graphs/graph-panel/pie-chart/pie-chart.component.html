<div id="toolbar">
    <button mat-raised-button color="secondary" (click)="exportToCsv()">
        <mat-icon>description</mat-icon>
        Export as CSV
    </button>
</div>
<div class="chart-row">
    <div
        class="chart-canvas"
        echarts
        [options]="piechartOptions()"
        [theme]="themeService.chartTheme()"
        (chartInit)="onChartInit($event)"
    ></div>
    <app-chart-legend
        [items]="legendItems()"
        [sort]="legendSort()"
        (sortChange)="legendSort.set($event)"
        (toggleSeries)="toggleLegend($event)"
    ></app-chart-legend>
</div>
