<div id="toolbar">
    <mat-checkbox
        color="primary"
        class="mb-4"
        [checked]="normalized()"
        (change)="normalized.set($event.checked)"
    >
        normalized
    </mat-checkbox>
    <button mat-raised-button color="secondary" (click)="exportToCsv()">
        <mat-icon>description</mat-icon>
        Export as CSV
    </button>
</div>

<div class="chart-row">
    <div
        class="chart-canvas"
        echarts
        [options]="options()"
        [theme]="themeService.chartTheme()"
        (chartInit)="onChartInit($event)"
    ></div>
    <app-chart-legend
        [items]="legendItems()"
        [sort]="legendSort()"
        (sortChange)="legendSort.set($event)"
        (toggleSeries)="toggleLegend($event)"
    ></app-chart-legend>
</div>
