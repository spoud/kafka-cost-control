<mat-card appearance="outlined" class="panel">
    <div class="panel-header">
        <div class="panel-heading">
            <h3 class="panel-title">{{ panelData().title }}</h3>
            @if (panelData().description) {
                <p class="panel-description">{{ panelData().description }}</p>
            }
            <p class="panel-meta">{{ panelData() | metaData }}</p>
        </div>
        <button
            mat-icon-button
            type="button"
            class="settings-button"
            aria-label="Panel settings"
            (click)="openOptions()"
        >
            <mat-icon>settings</mat-icon>
        </button>
    </div>
    <mat-card-content class="panel-body">
        <ng-container
            [ngComponentOutlet]="component()"
            [ngComponentOutletInputs]="{ id: panelData().id }"
        />
    </mat-card-content>

    @if (showOptions()) {
        <app-panel-options [panelData]="panelData()" />
    }
</mat-card>
