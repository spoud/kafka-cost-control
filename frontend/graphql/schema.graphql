type AssistantStatus {
  available: Boolean!
  reason: String
}

type BillEntity {
  "End (exclusive) of what the amounts cover, for a month-to-date bill; null: the whole month (ISO-8601)"
  coveredUntil: DateTime
  "The billed month, yyyy-MM"
  month: String!
  networkRead: Float
  networkWrite: Float
  "Everything else on the bill, line by line, each with where it goes"
  otherLines: [OtherLine!]!
  partitions: Float
  storage: Float
  "ISO-8601"
  updatedAt: DateTime!
  updatedBy: String
}

type BilledCostResponse {
  metrics: [MetricCosts!]!
  "Each month the range touches, and whether a bill covers it"
  months: [MonthBilling!]!
}

type ChatAnswer {
  columns: [String!]!
  complete: Boolean!
  contextLost: Boolean!
  error: String
  generatedSql: [String!]!
  rows: [[String]!]!
  text: String!
  truncated: Boolean!
}

type ContextDataEntity {
  context(
    "Get entry/entries for a certain key/s"
    key: [String]
  ): [Entry_String_String!]!
  "ISO-8601"
  creationTime: DateTime!
  entityType: EntityType!
  id: String
  regex: String!
  "ISO-8601"
  validFrom: DateTime
  "ISO-8601"
  validUntil: DateTime
}

type ContextTestResponse {
  context(
    "Get entry/entries for a certain key/s"
    key: [String]
  ): [Entry_String_String!]!
  entityType: EntityType!
}

type EarlierPrice {
  baseCost: Float!
  costFactor: Float!
  multiplier: Float
  multiplierLabel: String
  price: Float
  priceUnit: PriceUnit
  "ISO-8601"
  validFrom: DateTime
  "ISO-8601"
  validUntil: DateTime!
}

type Entry_String_String {
  key: String
  value: String
}

type MetricCosts {
  metric: String!
  shares: [Share!]!
}

type MetricHistory {
  context(
    "Get entry/entries for a certain key/s"
    key: [String]
  ): [Entry_String_String]!
  costs: [Float]!
  name: String!
  "ISO-8601"
  times: [DateTime]!
  values: [Float]!
}

type MetricNameEntity {
  aggregationType: String!
  "ISO-8601"
  lastSeen: DateTime!
  metricName: String!
}

type MonthBilling {
  "Whether a bill exists for the month"
  billed: Boolean!
  "Where the bill's amounts stop; after it, the rate card applies (ISO-8601)"
  billedUntil: DateTime
  "The part of the range in this month (ISO-8601)"
  from: DateTime!
  month: String!
  "ISO-8601"
  to: DateTime!
}

"Mutation root"
type Mutation {
  "Ask a natural-language question about the aggregated metrics data."
  chat(request: ChatRequestInput): ChatAnswer!
  "Forget the conversation history for one session."
  clearChat(sessionId: String!): Boolean!
  deleteBill(month: String!): BillEntity
  deleteContextData(request: ContextDataDeleteRequestInput): ContextDataEntity
  deletePricingRule(request: PricingRuleDeleteRequestInput): PricingRuleEntity
  reprocess(
    areYouSure: String!,
    "ISO-8601"
    startTime: DateTime
  ): String!
  "Saves a month's bill, replacing the month's previous one"
  saveBill(request: BillSaveRequestInput!): BillEntity!
  saveContextData(request: ContextDataSaveRequestInput): ContextDataEntity!
  savePricingRule(request: PricingRuleSaveRequestInput): PricingRuleEntity!
  "Drops the current price and makes the previous one current again"
  undoPricingRuleChange(request: PricingRuleDeleteRequestInput): PricingRuleEntity!
}

type OtherLine {
  allocation: Allocation!
  "In dollars; negative for a credit"
  amount: Float!
  "For CONTEXT: the context the amount belongs to, e.g. tenant=data-platform"
  context(
    "Get entry/entries for a certain key/s"
    key: [String]
  ): [Entry_String_String!]
  description: String!
}

type PricingRuleEntity {
  baseCost: Float!
  "Cost per unit of the metric's raw value, derived from the price when one is set"
  costFactor: Float!
  "ISO-8601"
  creationTime: DateTime!
  "The prices before the current one, oldest first"
  earlierPrices: [EarlierPrice!]!
  metricName: String!
  "Factor on top of the price, e.g. 3 replicas; null means 1"
  multiplier: Float
  multiplierLabel: String
  "Price per priceUnit as entered; null for rules saved with a bare cost factor"
  price: Float
  priceUnit: PriceUnit
  "When the current price started; null: it has always applied (ISO-8601)"
  validFrom: DateTime
}

"Query root"
type Query {
  "Whether the AI assistant is configured and able to answer questions."
  assistantStatus: AssistantStatus!
  "Costs in cents from the monthly bills, with the rate card where no bill applies"
  billedCosts(request: BilledCostRequestInput!): BilledCostResponse!
  "All bills, newest month first, in dollars"
  bills: [BillEntity!]!
  contextData: [ContextDataEntity!]!
  contextTest(testString: String): [ContextTestResponse!]!
  currentUser: String!
  existingContextKeys: [String!]!
  history(from: DateTimeParameterInput!, groupByContextKeys: [String]!, metricNames: [String]!, to: DateTimeParameterInput): [MetricHistory!]!
  metricContextKeys: [String!]!
  metricNames: [MetricNameEntity!]!
  pricingRules: [PricingRuleEntity!]!
  "Topics and principals no context rule assigns (or without a value for contextKey), most expensive first; no from = the last 7 days"
  unassignedEntities(request: UnassignedEntitiesRequestInput): [UnassignedEntity!]!
}

type Share {
  "The values of the grouping keys, in their order; <other> where none, <shared> for what is assigned to no one"
  contextValues: [String!]!
  "The part in cents that comes from the rate card because no bill covers it"
  estimatedPrice: Float!
  name: String!
  "Total in cents, the estimated part included"
  price: Float!
}

"A topic or principal whose metrics carry no value for a context key: no rule assigns it"
type UnassignedEntity {
  "What it cost in the period, in dollars, as on Cost Overview"
  cost: Float!
  entityType: EntityType!
  "End of the last window it appeared in (ISO-8601)"
  lastSeen: DateTime!
  "Metrics recorded for it in the period"
  metrics: [String!]!
  name: String!
}

enum Allocation {
  CONTEXT
  SHARED
  USAGE
}

enum EntityType {
  PRINCIPAL
  TOPIC
  UNKNOWN
}

"What a pricing rule's price is per"
enum PriceUnit {
  "Per GB of the metric's value, 1 GB = 2^30 bytes as Confluent bills (e.g. network bytes)"
  GB
  "Per GB held for one hourly window, 1 GB = 2^30 bytes (e.g. retained bytes)"
  GB_HOUR
  "Per unit of the metric's value for one hourly window (e.g. per partition)"
  UNIT
}

"Scalar for BigDecimal"
scalar BigDecimal

"Scalar for BigInteger"
scalar BigInteger

"Scalar for DateTime"
scalar DateTime

input BillSaveRequestInput {
  "For a month-to-date bill: the end (exclusive) of what the amounts cover. Empty: the whole month. (ISO-8601)"
  coveredUntil: DateTime
  "The billed month, yyyy-MM, in UTC"
  month: String!
  networkRead: Float
  networkWrite: Float
  "Everything else on the bill, line by line; an amount may be negative for a credit"
  otherLines: [OtherLineRequestInput]
  partitions: Float
  storage: Float
}

input BilledCostRequestInput {
  contextKeysToGroupBy: [String]
  "ISO-8601"
  from: DateTime
  "ISO-8601"
  to: DateTime
}

input ChatRequestInput {
  "The question to answer."
  message: String!
  "How many earlier questions the client is showing for this session."
  priorTurns: Int
  "Client-generated conversation id; history is kept per session."
  sessionId: String!
}

input ContextDataDeleteRequestInput {
  id: String!
}

input ContextDataSaveRequestInput {
  context: [Entry_String_StringInput!]!
  entityType: EntityType!
  id: String
  regex: String!
  "ISO-8601"
  validFrom: DateTime
  "ISO-8601"
  validUntil: DateTime
}

input ContextPairInput {
  key: String
  value: String
}

input DateTimeParameterInput {
  "ISO-8601"
  instant: DateTime
}

input Entry_String_StringInput {
  key: String
  value: String
}

input OtherLineRequestInput {
  allocation: Allocation
  "In dollars; negative for a credit"
  amount: Float
  "For CONTEXT: the context the amount belongs to, e.g. [{key: \"tenant\", value: \"data-platform\"}]"
  context: [ContextPairInput]
  description: String
}

input PricingRuleDeleteRequestInput {
  metricName: String!
}

input PricingRuleSaveRequestInput {
  baseCost: Float!
  "Cost per unit of the metric's raw value. Ignored when a price is given."
  costFactor: Float
  metricName: String!
  "Factor on top of the price, e.g. 3 for storage billed per replica. Default 1."
  multiplier: Float
  "What the multiplier stands for, e.g. replicas"
  multiplierLabel: String
  "Price per priceUnit; the cost factor is derived from it"
  price: Float
  priceUnit: PriceUnit
  "Empty: correct the current price, everywhere it applies. A time: a new price from then on; the current price keeps the hours before it. (ISO-8601)"
  validFrom: DateTime
}

input UnassignedEntitiesRequestInput {
  "A context key that counts as assigned; none = any context at all"
  contextKey: String
  "ISO-8601; windows starting at or after it (ISO-8601)"
  from: DateTime
  "ISO-8601; windows ending at or before it, none = up to now (ISO-8601)"
  to: DateTime
}
