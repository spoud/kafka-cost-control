type AssistantStatus {
  available: Boolean!
  reason: String
}

type ChatAnswer {
  columns: [String!]!
  complete: Boolean!
  error: String
  generatedSql: [String!]!
  rows: [[String]!]!
  text: String!
  truncated: Boolean!
}

type ContextDataEntity {
  context(
    "Get entry/entries for a certain key/s"
    key: [String]
  ): [Entry_String_String!]!
  "ISO-8601"
  creationTime: DateTime!
  entityType: EntityType!
  id: String
  regex: String!
  "ISO-8601"
  validFrom: DateTime
  "ISO-8601"
  validUntil: DateTime
}

type ContextTestResponse {
  context(
    "Get entry/entries for a certain key/s"
    key: [String]
  ): [Entry_String_String!]!
  entityType: EntityType!
}

type CostOverviewResponse {
  metricToDistributionMapList: [MetricToDistributionMap]
}

type Entry_String_String {
  key: String
  value: String
}

type MetricHistory {
  context(
    "Get entry/entries for a certain key/s"
    key: [String]
  ): [Entry_String_String]!
  name: String!
  "ISO-8601"
  times: [DateTime]!
  values: [Float]!
}

type MetricNameEntity {
  aggregationType: String!
  "ISO-8601"
  lastSeen: DateTime!
  metricName: String!
}

type MetricToDistributionMap {
  metric: String
  nameToPriceList: [NameToPrice]
}

"Mutation root"
type Mutation {
  "Ask a natural-language question about the aggregated metrics data."
  chat(request: ChatRequestInput): ChatAnswer!
  "Forget the conversation history for one session."
  clearChat(sessionId: String!): Boolean!
  deleteContextData(request: ContextDataDeleteRequestInput): ContextDataEntity
  deletePricingRule(request: PricingRuleDeleteRequestInput): PricingRuleEntity
  reprocess(
    areYouSure: String!,
    "ISO-8601"
    startTime: DateTime
  ): String!
  saveContextData(request: ContextDataSaveRequestInput): ContextDataEntity!
  savePricingRule(request: PricingRuleSaveRequestInput): PricingRuleEntity!
}

type NameToPrice {
  contextValues: [String]
  name: String
  price: Float
}

type PricingRuleEntity {
  baseCost: Float!
  costFactor: Float!
  "ISO-8601"
  creationTime: DateTime!
  metricName: String!
}

"Query root"
type Query {
  assistantStatus: AssistantStatus!
  calculateTable(request: CostOverviewRequestInput): TableResponse!
  contextData: [ContextDataEntity!]!
  contextTest(testString: String): [ContextTestResponse!]!
  costOverview(request: CostOverviewRequestInput): CostOverviewResponse!
  currentUser: String!
  existingContextKeys: [String!]!
  history(from: DateTimeParameterInput!, groupByContextKeys: [String]!, metricNames: [String]!, to: DateTimeParameterInput): [MetricHistory!]!
  metricContextKeys: [String!]!
  metricNames: [MetricNameEntity!]!
  pricingRules: [PricingRuleEntity!]!
}

type TableEntry {
  context: [String]
  initialMetricName: String
  percentage: Float!
  total: Float!
}

type TableResponse {
  entries: [TableEntry]
}

enum EntityType {
  PRINCIPAL
  TOPIC
  UNKNOWN
}

"Scalar for BigDecimal"
scalar BigDecimal

"Scalar for BigInteger"
scalar BigInteger

"Scalar for DateTime"
scalar DateTime

input ContextDataDeleteRequestInput {
  id: String!
}

input ContextDataSaveRequestInput {
  context: [Entry_String_StringInput!]!
  entityType: EntityType!
  id: String
  regex: String!
  "ISO-8601"
  validFrom: DateTime
  "ISO-8601"
  validUntil: DateTime
}

input ChatRequestInput {
  "The question to answer."
  message: String!
  "Client-generated conversation id; history is kept per session."
  sessionId: String!
}

input CostOverviewRequestInput {
  contextKeysToGroupBy: [String]
  "ISO-8601"
  from: DateTime
  kafkaNetworkReadCents: Int
  kafkaNetworkWriteCents: Int
  kafkaStorageCents: Int
  "ISO-8601"
  to: DateTime
  totalCents: Int
}

input DateTimeParameterInput {
  "ISO-8601"
  instant: DateTime
}

input Entry_String_StringInput {
  key: String
  value: String
}

input PricingRuleDeleteRequestInput {
  metricName: String!
}

input PricingRuleSaveRequestInput {
  baseCost: Float!
  costFactor: Float!
  metricName: String!
}
