name: Build operator

on:
  push:
    branches: [ master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ master ]
    paths: ['strimzi-operator/**', '.github/workflows/build-operator.yaml']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo Version: $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # v1 variant (default) -- runs the full test suite. This is also what earlier PR/master builds
      # already exercised, so this step's output is the one used for the plain (non-suffixed) image tags.
      - name: Build with maven (v1)
        working-directory: strimzi-operator/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: mvn -B clean verify -Pfailsafe -Dcc.strimzi.crd-version=v1

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest (v1)
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: strimzi-operator/
          file: strimzi-operator/src/main/docker/Dockerfile.jvm
          push: true
          tags: spoud/kafka-cost-control-strimzi-operator:latest

      - name: Build and push tag (v1)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: strimzi-operator/
          file: strimzi-operator/src/main/docker/Dockerfile.jvm
          push: true
          tags: spoud/kafka-cost-control-strimzi-operator:${{ env.VERSION }}

      # v1beta2 variant -- for Strimzi Cluster Operator installs (pre-0.49.0) whose CRDs only serve
      # v1beta2 for KafkaUser/KafkaTopic. Tests are skipped here: OperatorTest's fixtures create
      # resources via the v1 classes directly, which is a valid combination only for the v1 build
      # above; V1Beta2CompatTest already covers the v1beta2 data path and runs as part of that build.
      - name: Build with maven (v1beta2)
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        working-directory: strimzi-operator/
        run: mvn -B clean package -DskipTests -Dcc.strimzi.crd-version=v1beta2

      - name: Build and push latest (v1beta2)
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: strimzi-operator/
          file: strimzi-operator/src/main/docker/Dockerfile.jvm
          push: true
          tags: spoud/kafka-cost-control-strimzi-operator:latest-v1beta2

      - name: Build and push tag (v1beta2)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: strimzi-operator/
          file: strimzi-operator/src/main/docker/Dockerfile.jvm
          push: true
          tags: spoud/kafka-cost-control-strimzi-operator:${{ env.VERSION }}-v1beta2
