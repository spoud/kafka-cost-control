name: Build operator

on:
  push:
    branches: [ master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ master ]
    paths: ['strimzi-operator/**', '.github/workflows/build-operator.yaml']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # v1 (default): full test suite, plain (non-suffixed) image tags.
          - crd-version: v1
            tag-suffix: ""
            maven-goal: verify
            maven-args: -Pfailsafe
          # v1beta2: for Strimzi Cluster Operator installs (pre-0.49.0) whose CRDs only serve v1beta2 for
          # KafkaUser/KafkaTopic. Tests are skipped: OperatorTest's fixtures create resources via the v1
          # classes directly, a valid combination only for the v1 variant above; V1Beta2CompatTest already
          # covers the v1beta2 data path and runs as part of every matrix job.
          - crd-version: v1beta2
            tag-suffix: "-v1beta2"
            maven-goal: package
            maven-args: -DskipTests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo Version: $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with maven
        working-directory: strimzi-operator/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: mvn -B clean ${{ matrix.maven-goal }} ${{ matrix.maven-args }} -Dcc.strimzi.crd-version=${{ matrix.crd-version }}

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: strimzi-operator/
          file: strimzi-operator/src/main/docker/Dockerfile.jvm
          push: true
          tags: spoud/kafka-cost-control-strimzi-operator:latest${{ matrix.tag-suffix }}

      - name: Build and push tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: strimzi-operator/
          file: strimzi-operator/src/main/docker/Dockerfile.jvm
          push: true
          tags: spoud/kafka-cost-control-strimzi-operator:${{ env.VERSION }}${{ matrix.tag-suffix }}
