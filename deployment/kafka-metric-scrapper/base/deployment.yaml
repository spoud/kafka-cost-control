apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      labels:
        app: telegraf
    spec:
      volumes:
        - name: config
          configMap:
            name: telegraf-config
            defaultMode: 420
            optional: false
      containers:
        - name: telegraf
          image: telegraf:1.40.1-alpine
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 1
              memory: 500Mi
            requests:
              cpu: 100m
              memory: 100Mi
          envFrom:
            - secretRef:
                name: telegraf-secret
            # non-secret settings kept in git; listed last, so they win over the same keys in the secret
            - configMapRef:
                name: telegraf-settings
                optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf-config.toml
              mountPropagation: None
            # extra inputs: Telegraf also loads every *.conf key of the same config map from here
            - name: config
              mountPath: /etc/telegraf/telegraf.d
              mountPropagation: None
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
