apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-cost-control
spec:
  selector:
    matchLabels:
      k8s-app: kafka-cost-control
  serviceName: "kafka-cost-control"
  replicas: 1
  template:
    metadata:
      labels:
        k8s-app: kafka-cost-control
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        fsGroup: 185 # jboss
      containers:
        - name: kafka-cost-control
          image: spoud/kafka-cost-control:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 4000m
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 1Gi
          env:
            - name: QUARKUS_KAFKA_STREAMS_STATE_DIR
              value: /home/jboss/kafka-stream/data/
            - name: QUARKUS_PROFILE
              value: "ccloud"
            - name: CC_OLAP_ENABLED
              value: "true"
            - name: CC_OLAP_DATABASE_URL
              value: "jdbc:duckdb:/home/jboss/duckdb/cc.duckdb"
            - name: CC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cost-control-secret
                  key: CC_ADMIN_PASSWORD
            # AI assistant, off by default. No model is configured here on purpose: a default
            # would name a vendor nobody has chosen, and there is no right answer while the
            # feature is switched off. The application's own defaults keep startup valid.
            #
            # To enable, set CC_AI_ENABLED=true and add, in this overlay:
            #   CC_AI_BASE_URL  any OpenAI-compatible endpoint - one client reaches every vendor,
            #                   so this alone selects the provider:
            #                     http://ollama:11434/v1                   in-cluster, no key,
            #                                                              nothing leaves the cluster
            #                     https://api.openai.com/v1
            #                     https://api.anthropic.com/v1/
            #                     https://openrouter.ai/api/v1
            #                   Use a Service name, not localhost - in a pod localhost is the pod.
            #   CC_AI_MODEL     matching model id. It must support tool calling; the assistant is
            #                   built entirely on tools and cannot answer without them.
            #   CC_AI_API_KEY   from the secret below, for providers that need one.
            - name: CC_AI_ENABLED
              value: "false"
            - name: CC_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kafka-cost-control-secret
                  key: CC_AI_API_KEY
                  optional: true
          envFrom:
            - secretRef:
                name: kafka-cost-control-secret
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: kstream-data
              mountPath: /home/jboss/kafka-stream/
            - name: duckdb-data
              mountPath: /home/jboss/duckdb/
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
              scheme: HTTP
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
              scheme: HTTP

  volumeClaimTemplates:
    - metadata:
        name: kstream-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: duckdb-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi

---
kind: Service
apiVersion: v1
metadata:
  labels:
    k8s-app: kafka-cost-control
  name: kafka-cost-control-service
spec:
  ports:
    - port: 8080
      name: http
      targetPort: 8080
  selector:
    k8s-app: kafka-cost-control

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-cost-control-ingress
spec:
  rules:
    - host: "TO_BE_DEFINED_BY_OVERRIDE"
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: kafka-cost-control
                port:
                  number: 8080
